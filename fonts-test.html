<!DOCTYPE html>
<!-- TEMPORARY font comparison page (preview branch only). Remove once a body font is chosen. Served at /fonts-test. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<base href="/">
<title>Font test · Infint</title>
<meta name="theme-color" content="#0E1115">
<meta name="color-scheme" content="dark">
<link rel="icon" href="assets/icons/favicon.ico" sizes="any">
<link rel="stylesheet" href="css/style.css?v=fonts-test">
<style>
/* Candidate body fonts, self-hosted like Outfit and Montserrat (variable files, Latin only) */
@font-face{font-family:'Inter';font-weight:100 900;font-display:swap;src:url(assets/fonts/inter-latin.woff2) format('woff2')}
@font-face{font-family:'DM Sans';font-weight:100 1000;font-display:swap;src:url(assets/fonts/dmsans-latin.woff2) format('woff2')}
@font-face{font-family:'Manrope';font-weight:200 800;font-display:swap;src:url(assets/fonts/manrope-latin.woff2) format('woff2')}
@font-face{font-family:'Hanken Grotesk';font-weight:100 900;font-display:swap;src:url(assets/fonts/hanken-latin.woff2) format('woff2')}

/* Each column swaps the body font only. Big headings keep their current fonts:
   section titles stay Outfit, big titles, prices and menu page links stay Montserrat. */
.ft{--body:var(--f),system-ui,sans-serif;--display:var(--f),system-ui,sans-serif;font-family:var(--body);min-width:0}
.ft h1,.ft h2,.ft h3,.ft h4,.ft .h2{font-family:'Outfit',system-ui,sans-serif}

.ft-top{padding:calc(var(--hdr) + 8px) var(--gut) 8px}
.ft-top p{max-width:70ch;margin:10px 0 0;color:var(--mute)}
.ft-tabs{position:sticky;top:var(--hdr);z-index:20;display:flex;gap:8px;overflow-x:auto;padding:12px var(--gut);background:rgba(14,17,21,.94);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);scrollbar-width:none}
.ft-tabs::-webkit-scrollbar{display:none}
.ft-tabs button{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:none;color:var(--white);
  font:500 .95rem/1 var(--fb,'Outfit'),system-ui,sans-serif;cursor:pointer}
.ft-tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.ft-cols{display:grid;gap:clamp(20px,2vw,32px);padding:24px var(--gut) 80px;max-width:var(--max-wide);margin:0 auto}
.ft-name{position:sticky;top:calc(var(--hdr) + 64px);z-index:5;display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;margin-bottom:8px;
  background:var(--ink);border-bottom:1px solid var(--accent)}
.ft-name b{font-family:var(--heavy);font-weight:900;font-size:1.5rem;letter-spacing:-.02em}
.ft-name span{font-family:var(--body);font-size:.95rem;color:var(--accent)}
.ft-block{margin-top:36px}
.ft-block>.label{display:block;margin-bottom:14px;color:var(--accent)}
.ft .about-me{display:block}
.ft .about-me p{margin:0 0 1em}
/* The menu sample sits in the page instead of filling the screen */
.ft .nav-sample{border:1px solid var(--line);border-radius:var(--r);padding:8px 20px 16px;background:var(--ink-2)}
.ft .nav-sample .nav-l,.ft .nav-sample .nav-cats{transform:none;opacity:1}
.ft .nav-sample .nav-l{font-size:clamp(1.6rem,6vw,2.2rem)}
.ft .nav-sample .nav-cats{grid-template-columns:repeat(2,minmax(0,1fr));border-left:0;padding:6px 0 10px}
.ft .nav-sample .nav-cats .nav-h{display:none}
.ft .btnrow{display:flex;flex-wrap:wrap;gap:12px}
.ft .acc .body{display:none}
.ft .acc.open .body{display:block}
.ft .acc .body>div{padding:0 0 22px}
/* Phones: one font at a time, chosen with the buttons. Wide screens: all five side by side. */
.ft[hidden]{display:none}
@media(min-width:1280px){
  .ft-tabs{display:none}
  .ft-cols{grid-template-columns:repeat(5,minmax(0,1fr))}
  .ft[hidden]{display:block}
  .ft-name{top:var(--hdr)}
  .ft .pkg{padding:22px}
}
</style>
</head>
<body>
<header class="site solid" id="hdr">
  <div class="bar">
    <a href="/" class="logo" aria-label="Infint home"><img src="assets/brand/infint-wordmark-white-transparent.png" width="867" height="165" alt="Infint"></a>
  </div>
</header>
<main>
  <div class="ft-top">
    <h1 class="h2">Body font test</h1>
    <p>Temporary page. The same samples in five body fonts. Only the body text changes: big titles, prices, the big menu links and the section headings stay as they are now. On a phone, tap a name to switch; on a wide screen all five sit side by side.</p>
  </div>
  <div class="ft-tabs" id="tabs" role="group" aria-label="Choose a font"></div>
  <div class="ft-cols" id="cols"></div>
</main>
<script src="js/content.js?v=fonts-test"></script>
<script>
const FONTS=[
  {f:"'Outfit'",name:"Outfit",note:"Current"},
  {f:"'Inter'",name:"Inter",note:"Option 1"},
  {f:"'DM Sans'",name:"DM Sans",note:"Option 2"},
  {f:"'Manrope'",name:"Manrope",note:"Option 3"},
  {f:"'Hanken Grotesk'",name:"Hanken Grotesk",note:"Option 4"}
];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ARR='<span class="arr" aria-hidden="true"></span>';
const rand=n=>"R"+String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");
const R=CONFIG.rates.grads.items, pkg=R.find(p=>p.feature)||R[0];
function sample(){
  return `
  <div class="ft-block"><span class="label">About page paragraph</span>
    <div class="about-me">${CONFIG.aboutMe.slice(0,2).map(p=>`<p>${esc(p)}</p>`).join("")}</div>
    <p class="lede">${esc(CONFIG.brand.intro)}</p>
  </div>
  <div class="ft-block"><span class="label">Rate card</span>
    <div class="pkg ${pkg.feature?"featured":""}">
      <div class="top"><span class="name">${esc(pkg.name)}</span>${pkg.feature?'<span class="badge">Most booked</span>':`<span class="label">${esc(pkg.dur)}</span>`}</div>
      <div class="mega"><span class="cur">R</span>${esc(rand(pkg.price).slice(1))}</div>
      <div class="sub">${pkg.feature?esc(pkg.dur)+", ":""}${esc(pkg.images)}</div>
      <ul>${pkg.includes.map(i=>`<li><span>${esc(i)}</span></li>`).join("")}</ul>
      <a class="btn magnetic" href="/book">Book ${esc(pkg.name)} ${ARR}</a>
    </div>
  </div>
  <div class="ft-block"><span class="label">Menu</span>
    <div class="nav-sample">
      <a class="nav-l" href="/work">Work</a>
      <ul class="nav-cats">${CATEGORIES.map(c=>`<li><a href="/work?f=${c.key}">${esc(c.name)}</a></li>`).join("")}</ul>
      <a class="nav-l" href="/rates">Rates</a>
      <a class="nav-l" href="/about">About</a>
    </div>
  </div>
  <div class="ft-block"><span class="label">Buttons and labels</span>
    <div class="btnrow"><a class="btn magnetic" href="/book">Book a shoot ${ARR}</a><a class="btn ghost" href="/work">See the work</a></div>
    <div class="hero-meta label" style="margin-top:22px"><span>Photography</span><span>${esc(CONFIG.brand.city)}, ZA</span></div>
  </div>
  <div class="ft-block"><span class="label">FAQ</span>
    <div>${CONFIG.faq.slice(0,4).map((f,i)=>`<div class="acc ${i===0?"open":""}"><button type="button" aria-expanded="${i===0}">${esc(f.q)}<span class="pm" aria-hidden="true"></span></button>
      <div class="body"><div><p>${esc(f.a)}</p></div></div></div>`).join("")}</div>
  </div>`;
}
const cols=document.getElementById("cols"), tabs=document.getElementById("tabs");
cols.innerHTML=FONTS.map((x,i)=>`<section class="ft" id="ft-${i}" style="--f:${x.f}" aria-label="${esc(x.name)}" ${i?"hidden":""}>
  <div class="ft-name"><b>${esc(x.name)}</b><span>${esc(x.note)}</span></div>${sample()}</section>`).join("");
tabs.innerHTML=FONTS.map((x,i)=>`<button type="button" style="--fb:${x.f}" aria-pressed="${i===0}" data-i="${i}">${esc(x.name)}${i===0?" (now)":""}</button>`).join("");
tabs.addEventListener("click",e=>{const b=e.target.closest("button"); if(!b) return;
  tabs.querySelectorAll("button").forEach(t=>t.setAttribute("aria-pressed",String(t===b)));
  cols.querySelectorAll(".ft").forEach((s,i)=>s.hidden=String(i)!==b.dataset.i);});
cols.addEventListener("click",e=>{const b=e.target.closest(".acc button"); if(b){const a=b.parentElement; a.classList.toggle("open"); b.setAttribute("aria-expanded",String(a.classList.contains("open")));}
  if(e.target.closest("a")) e.preventDefault();});
</script>
</body>
</html>
